<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:851px; height:315px; overflow:hidden; }

.cover {
  width:851px; height:315px;
  background:#0A1810;
  position:relative; overflow:hidden;
  font-family:'Barlow',sans-serif;
}

/* Fond géométrique */
.bg-hex {
  position:absolute;
  top:-60px; right:-40px;
  width:280px; height:280px;
  opacity:0.06;
}
.bg-circle-1 {
  position:absolute;
  width:400px; height:400px;
  border-radius:50%;
  border:1px solid rgba(168,255,120,0.08);
  top:-150px; left:180px;
}
.bg-circle-2 {
  position:absolute;
  width:200px; height:200px;
  border-radius:50%;
  border:1px solid rgba(27,107,58,0.15);
  bottom:-80px; right:160px;
}

/* Barre verte gauche */
.bar { position:absolute; left:0; top:0; width:6px; height:315px; background:#1B6B3A; }

/* Barre lime top */
.bar-top { position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#1B6B3A,#A8FF78,#1B6B3A); }

/* Icone + logo gauche */
.logo-zone {
  position:absolute;
  left:40px; top:0; bottom:0;
  display:flex; flex-direction:column;
  justify-content:center; gap:10px;
}
.icon-wrap {
  width:52px; height:52px;
}
.wordmark-the {
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-weight:700;
  color:#A8FF78; letter-spacing:6px;
  text-transform:uppercase;
}
.wordmark-main {
  font-family:'Bebas Neue',sans-serif;
  font-size:56px; color:#fff;
  line-height:0.85; letter-spacing:2px;
}
.wordmark-sub {
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:600;
  color:#A8FF78; letter-spacing:7px;
  text-transform:uppercase;
}
.divider { width:100%; height:1.5px; background:rgba(46,204,113,0.4); margin:4px 0; }

/* Contenu droite */
.right-zone {
  position:absolute;
  right:40px; top:0; bottom:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:flex-end;
  gap:10px;
}
.tagline {
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px; font-weight:700;
  color:#fff; text-align:right;
  line-height:1.1; letter-spacing:0.5px;
}
.tagline span { color:#A8FF78; }
.edition-badge {
  background:#1B6B3A;
  border:1px solid rgba(168,255,120,0.3);
  border-radius:20px;
  padding:5px 16px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-weight:700;
  color:#A8FF78; letter-spacing:2px;
  text-transform:uppercase;
}
.info-row {
  display:flex; gap:16px; align-items:center;
}
.info-item {
  font-family:'Barlow',sans-serif;
  font-size:12px; color:rgba(255,255,255,0.55);
  display:flex; align-items:center; gap:5px;
}
.info-dot {
  width:5px; height:5px; border-radius:50%;
  background:#A8FF78; flex-shrink:0;
}

/* Séparateur vertical */
.vsep {
  position:absolute;
  left:260px; top:40px; bottom:40px;
  width:1px; background:rgba(168,255,120,0.1);
}

/* Footer bande */
.footer-band {
  position:absolute;
  bottom:0; left:0; right:0; height:36px;
  background:#1B6B3A;
  display:flex; align-items:center;
  padding:0 40px; justify-content:space-between;
}
.footer-brand {
  font-family:'Bebas Neue',sans-serif;
  font-size:14px; color:#fff; letter-spacing:2px;
}
.footer-contact {
  font-family:'Barlow',sans-serif;
  font-size:11px; font-weight:500;
  color:rgba(255,255,255,0.8);
}

/* Data bars décoratifs */
.data-bars {
  position:absolute;
  right:300px; bottom:45px;
  display:flex; align-items:flex-end; gap:4px;
  opacity:0.15;
}
.data-bar { width:6px; border-radius:2px 2px 0 0; background:#A8FF78; }
</style>
</head>
<body>
<div class="cover">
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>
  <div class="bar-top"></div>
  <div class="bar"></div>

  <!-- Data bars déco -->
  <div class="data-bars">
    <div class="data-bar" style="height:20px;"></div>
    <div class="data-bar" style="height:35px;"></div>
    <div class="data-bar" style="height:50px;"></div>
    <div class="data-bar" style="height:65px;"></div>
    <div class="data-bar" style="height:45px;"></div>
    <div class="data-bar" style="height:30px;"></div>
  </div>

  <!-- Logo zone -->
  <div class="logo-zone">
    <svg class="icon-wrap" viewBox="0 0 64 64" fill="none">
      <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#1B6B3A" stroke="#2ECC71" stroke-width="1.5"/>
      <rect x="18" y="36" width="5" height="10" rx="1" fill="#A8FF78"/>
      <rect x="26" y="28" width="5" height="18" rx="1" fill="#A8FF78" opacity="0.8"/>
      <rect x="34" y="20" width="5" height="26" rx="1" fill="#A8FF78" opacity="0.6"/>
      <rect x="42" y="14" width="5" height="32" rx="1" fill="#A8FF78" opacity="0.35"/>
      <line x1="18" y1="36" x2="47" y2="36" stroke="#2ECC71" stroke-width="1" opacity="0.5"/>
      <circle cx="32" cy="12" r="2" fill="#A8FF78"/>
    </svg>
    <div>
      <div class="wordmark-the">THE</div>
      <div class="divider"></div>
      <div class="wordmark-main">DIGITAL<br>FORUM</div>
      <div class="divider"></div>
      <div class="wordmark-sub">Conakry · Guinée</div>
    </div>
  </div>

  <div class="vsep"></div>

  <!-- Right zone -->
  <div class="right-zone">
    <div class="edition-badge">✦ Première Édition — Mai 2026</div>
    <div class="tagline">
      Le rendez-vous<br>Trimestriel du<br><span>digital entrepreneurial</span><br>en Guinée.
    </div>
    <div class="info-row">
      <div class="info-item"><div class="info-dot"></div>Entrepreneurs</div>
      <div class="info-item"><div class="info-dot"></div>Freelances</div>
      <div class="info-item"><div class="info-dot"></div>Créateurs</div>
      <div class="info-item"><div class="info-dot"></div>Étudiants</div>
    </div>
  </div>

  <div class="footer-band">
    <div class="footer-brand">THE DIGITAL FORUM · Popy Tech Agency</div>
    <div class="footer-contact">📱 +224 612 960 453 · 🌐 popytech.com</div>
  </div>
</div>
</body>
</html>
