<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1024px; height:512px; overflow:hidden; }

.cover {
  width:1024px; height:512px;
  background:#0A1810;
  position:relative; overflow:hidden;
  font-family:'Barlow',sans-serif;
}

/* Fond géo */
.hex-bg {
  position:absolute;
  top:-80px; right:-60px;
  opacity:0.08;
}
.circle-bg-1 {
  position:absolute;
  width:500px; height:500px;
  border-radius:50%;
  border:1px solid rgba(168,255,120,0.07);
  top:-200px; left:50%;
  transform:translateX(-50%);
}
.circle-bg-2 {
  position:absolute;
  width:300px; height:300px;
  border-radius:50%;
  border:1px solid rgba(27,107,58,0.12);
  bottom:-120px; right:80px;
}

/* Top bar */
.top-bar { position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#1B6B3A,#A8FF78,#27AE60); }
/* Bottom bar */
.bot-bar { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#1B6B3A,#A8FF78,#27AE60); }

/* Layout centré - format carré WhatsApp */
.center-layout {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

/* Logo mark */
.logo-mark {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.the-txt {
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px; font-weight:700;
  color:#A8FF78; letter-spacing:8px;
}
.main-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:88px; color:#fff;
  line-height:0.85; letter-spacing:4px;
  text-align:center;
}
.sub-txt {
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px; font-weight:700;
  color:#A8FF78; letter-spacing:8px;
  text-transform:uppercase;
}
.divider { width:200px; height:2px; background:rgba(46,204,113,0.4); }

/* Tagline */
.tagline {
  font-family:'Barlow',sans-serif;
  font-size:16px; font-weight:400;
  color:rgba(255,255,255,0.6);
  text-align:center; letter-spacing:0.5px;
}
.tagline strong { color:#A8FF78; font-weight:700; }

/* Pill badges */
.badges {
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
}
.pill {
  background:rgba(27,107,58,0.3);
  border:1px solid rgba(168,255,120,0.25);
  border-radius:20px;
  padding:6px 18px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:700;
  color:#A8FF78; letter-spacing:1px;
  text-transform:uppercase;
}

/* Icone centré haut */
.icon-top {
  position:absolute;
  top:24px; left:50%; transform:translateX(-50%);
}

/* Coins décoratifs */
.corner {
  position:absolute;
  width:50px; height:50px;
}
.corner-tl { top:12px; left:12px; border-top:2px solid rgba(168,255,120,0.3); border-left:2px solid rgba(168,255,120,0.3); }
.corner-tr { top:12px; right:12px; border-top:2px solid rgba(168,255,120,0.3); border-right:2px solid rgba(168,255,120,0.3); }
.corner-bl { bottom:12px; left:12px; border-bottom:2px solid rgba(168,255,120,0.3); border-left:2px solid rgba(168,255,120,0.3); }
.corner-br { bottom:12px; right:12px; border-bottom:2px solid rgba(168,255,120,0.3); border-right:2px solid rgba(168,255,120,0.3); }

/* data bars left/right déco */
.data-left {
  position:absolute;
  left:30px; bottom:60px;
  display:flex; align-items:flex-end; gap:5px;
  opacity:0.12;
}
.data-right {
  position:absolute;
  right:30px; bottom:60px;
  display:flex; align-items:flex-end; gap:5px;
  opacity:0.12;
}
.db { width:7px; border-radius:2px 2px 0 0; background:#A8FF78; }

/* Contact bottom */
.contact-bar {
  position:absolute;
  bottom:12px; left:0; right:0;
  text-align:center;
  font-family:'Barlow',sans-serif;
  font-size:11px; color:rgba(255,255,255,0.3);
  letter-spacing:1px;
}
</style>
</head>
<body>
<div class="cover">
  <div class="circle-bg-1"></div>
  <div class="circle-bg-2"></div>
  <div class="top-bar"></div>
  <div class="bot-bar"></div>

  <!-- Coins -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Data bars déco -->
  <div class="data-left">
    <div class="db" style="height:18px;"></div>
    <div class="db" style="height:30px;"></div>
    <div class="db" style="height:45px;"></div>
    <div class="db" style="height:36px;"></div>
    <div class="db" style="height:22px;"></div>
  </div>
  <div class="data-right">
    <div class="db" style="height:22px;"></div>
    <div class="db" style="height:36px;"></div>
    <div class="db" style="height:45px;"></div>
    <div class="db" style="height:30px;"></div>
    <div class="db" style="height:18px;"></div>
  </div>

  <!-- Icone top -->
  <div class="icon-top">
    <svg viewBox="0 0 64 64" fill="none" style="width:36px;height:36px;">
      <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#1B6B3A" stroke="#2ECC71" stroke-width="2"/>
      <rect x="18" y="36" width="5" height="10" rx="1" fill="#A8FF78"/>
      <rect x="26" y="28" width="5" height="18" rx="1" fill="#A8FF78" opacity="0.8"/>
      <rect x="34" y="20" width="5" height="26" rx="1" fill="#A8FF78" opacity="0.6"/>
      <rect x="42" y="14" width="5" height="32" rx="1" fill="#A8FF78" opacity="0.35"/>
    </svg>
  </div>

  <!-- Centre -->
  <div class="center-layout">
    <div class="logo-mark">
      <div class="the-txt">THE</div>
      <div class="divider"></div>
      <div class="main-title">DIGITAL<br>FORUM</div>
      <div class="divider"></div>
      <div class="sub-txt">Conakry · Guinée · 2026</div>
    </div>
    <div class="tagline">
      La communauté du <strong>digital entrepreneurial</strong> en Afrique
    </div>
    <div class="badges">
      <div class="pill">🎤 Speakers</div>
      <div class="pill">💡 Ressources</div>
      <div class="pill">🤝 Networking</div>
      <div class="pill">🔥 Actualités</div>
    </div>
  </div>

  <div class="contact-bar">Popy Tech Agency · +224 612 960 453 · watshop.vercel.app</div>
</div>
</body>
</html>
